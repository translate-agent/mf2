name: Check

on:
  push:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2

  check:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        go-version: ['1.25', '1.26', '1.27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -v ./...
      - name: Fuzz
        if: ${{ matrix.go-version == '1.27' }}
        run: go test -v -run=^$ -fuzz=^FuzzParse$ -fuzztime=30s ./parse
      - name: golangci-lint
        if: ${{ matrix.go-version == '1.27' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
